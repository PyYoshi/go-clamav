# clamd configuration for the strict (alert-enabled) integration service.
#
# This is a TEST configuration. It pins the heuristic behaviors that
# fail-closed callers depend on, as measured against ClamAV 1.4/1.5
# (2026-07-30 verification): encrypted-archive/document alerts, broken-media
# alerts, and limit-exceeded alerts. Limits are deliberately tiny so the
# alert paths trigger with small in-memory samples.
#
# HeuristicScanPrecedence MUST stay "no" (the upstream default, made
# explicit here): with "yes", a mixed archive (encrypted entry + real
# malware) reports Heuristics.Encrypted.Zip instead of the malware
# signature, hiding the detection. The integration suite asserts the
# signature-wins behavior.

Foreground yes
LogVerbose yes

DatabaseDirectory /var/lib/clamav

# TCP only: the default clamd service owns the shared unix socket dir.
TCPSocket 3310
TCPAddr 0.0.0.0

# StreamMaxLength stays above every strict-suite sample so the INSTREAM
# size-limit ERROR path (covered by the default service) never masks the
# internal-limit behavior under test here.
StreamMaxLength 10M
MaxScanSize 2M
MaxFileSize 128K
MaxRecursion 4

MaxThreads 4
IdleTimeout 30

AlertEncryptedArchive yes
AlertEncryptedDoc yes
AlertExceedsMax yes
AlertBrokenMedia yes
HeuristicScanPrecedence no
